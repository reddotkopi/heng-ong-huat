name: Update draw results and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 4D draws are Wed, Sat and Sun at 6.30pm Singapore time (10.30am UTC).
    # Draw evenings: every 10 minutes from 6.45pm to 8.55pm SGT, for same-evening results.
    - cron: '45,55 10 * * 0,3,6'
    - cron: '5-55/10 11,12 * * 0,3,6'
    # The day after, the confirmed archive updates by noon: check at 1.20pm and 7.20pm SGT.
    - cron: '20 5 * * 0,1,4'
    - cron: '20 11 * * 0,1,4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      notify: ${{ steps.check.outputs.notify }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Note the results already published
        run: python3 scripts/notify.py --snapshot "$RUNNER_TEMP/before.json"
      - name: Refresh confirmed results
        run: python3 scripts/update_data.py
      - name: Refresh same-evening results (provisional)
        run: python3 scripts/update_live.py
      - name: Save new results
        id: save
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update 4D results: $(python3 scripts/notify.py --describe)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide what to publish
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.save.outputs.changed }}
        run: |
          # Scheduled runs only redeploy when the results changed.
          if [ "$EVENT" != schedule ] || [ "$CHANGED" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            python3 scripts/notify.py --diff "$RUNNER_TEMP/before.json"
          else
            echo "no new results"
          fi
      - name: Build the app
        if: steps.check.outputs.deploy == 'true'
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: python3 scripts/build.py
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Result alerts go out once the new results are live. Without the OneSignal settings
  # (see README) this step does nothing.
  notify:
    needs: [build, deploy]
    if: needs.build.outputs.notify != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Send result alerts
        env:
          NOTIFY: ${{ needs.build.outputs.notify }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/notify.py --send
