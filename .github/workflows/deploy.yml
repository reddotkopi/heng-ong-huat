name: Update draw results and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only_if_changed:
        description: Deploy only if the results changed (used by the evening watcher)
        type: boolean
        default: false
  schedule:
    # 4D draws are Wed, Sat and Sun at 6.30pm Singapore time (10.30am UTC). Same-evening results
    # are published by watch.yml, which starts this workflow as soon as they appear. These draw
    # evening runs are a fallback in case it fails (GitHub may start them late or drop them).
    - cron: '7 11 * * 0,3,6'    # 7.07pm SGT
    - cron: '47 11 * * 0,3,6'   # 7.47pm
    - cron: '33 12 * * 0,3,6'   # 8.33pm
    # The day after, the confirmed archive usually updates by 10am: check at 11.20am and 3.20pm SGT.
    - cron: '20 3 * * 0,1,4'
    - cron: '20 7 * * 0,1,4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://reddotkopi.github.io/heng-ong-huat/
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      notify: ${{ steps.check.outputs.notify }}
      disagree: ${{ steps.archive.outputs.disagree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the branch as it is now, not as it was when this run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Note what the live site shows
        run: python3 scripts/notify.py --snapshot "$RUNNER_TEMP/before.json"
      - name: Refresh confirmed results
        id: archive
        run: python3 scripts/update_data.py
      - name: Refresh same-evening results (provisional)
        run: python3 scripts/update_live.py
      - name: Save new results
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update 4D results: $(python3 scripts/notify.py --describe)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build the app
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: python3 scripts/build.py
      - name: Decide what to publish
        id: check
        env:
          EVENT: ${{ github.event_name }}
          ONLY_IF_CHANGED: ${{ inputs.only_if_changed }}
        run: |
          # Scheduled and watcher runs deploy when the live site differs from this build: new
          # results, or an earlier run whose deploy failed. Pushes and manual runs always deploy.
          live=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE_URL}version.txt?t=$(date +%s)" || true)
          if [ "$live" != "$(cat site/version.txt)" ] || { [ "$EVENT" != schedule ] && [ "$ONLY_IF_CHANGED" != true ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            python3 scripts/notify.py --diff "$RUNNER_TEMP/before.json"
          else
            echo "the live site is up to date"
          fi
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Result alerts go out once the new results are live. Without the OneSignal settings
  # (see README) this step does nothing.
  notify:
    needs: [build, deploy]
    if: needs.build.outputs.notify != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Send result alerts
        env:
          NOTIFY: ${{ needs.build.outputs.notify }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SEGMENT: ${{ vars.ONESIGNAL_SEGMENT }}
        run: python3 scripts/notify.py --send

  # The archive and the fast feed disagreed on a new draw's top three prizes. The archive's result
  # is published (it is the confirmed source); fail the run so the owner is emailed to check it.
  disagree:
    needs: [build, deploy, notify]
    if: always() && needs.build.outputs.disagree != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          DRAWS: ${{ needs.build.outputs.disagree }}
        run: |
          echo "::error::The archive and the fast feed disagree on the top three prizes of draw $DRAWS. The archive's result is published. Check it on Singapore Pools; if it is wrong, put the right numbers in data/corrections.json (see README)."
          exit 1
